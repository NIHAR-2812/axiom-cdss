# --- Export Settings ---
# Enable CSV export so your Python scripts have data to read
exporter.csv.export = true

# Disable formats you aren't using to speed up generation
exporter.fhir.export = false
exporter.metadata.export = false

# --- Directory Settings ---
# This ensures the output is always generated in the 'output' folder 
# inside your current Synthea directory
exporter.baseDirectory = ./output

# --- Population Settings ---
# Standardize on ICD-10 codes where possible for better mapping
# (Synthea will prioritize these formats for conditions)
generate.only_alive_patients = true